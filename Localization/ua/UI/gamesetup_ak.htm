font-size: 13px;

.tabs 
{
    behavior: tabs;
    height: 100%%;
    width: 100%%;
    overflow: hidden;
}

.tabs > .strip /* tab strip */
{
    margin:0px;
    padding:0px;
    flow:vertical;
}

.tabs > .strip > [panel] /* all tabs, passive by default */
{
	width:100px;
	height:29px;	
    padding: 0px 15px 0px 15px;
    margin: 0px;
    background-repeat: stretch;
    font-family: Georgia;
    font-size: 15px;
    font-weight: bold;
    color: #E4DDDB;
    vertical-align: middle;
    overflow: hidden;
}

.tabs > .strip > [panel]:current
{
	color: #FFFFFF;
}

.tabs  > .strip > [panel]#Campaign
{
	background-image:url(gamesetup/tab_left_default.png);
}

.tabs  > .strip > [panel]#Campaign:current
{
	background-image:url(gamesetup/tab_left_highlighted.png);
}

.tabs  > .strip > [panel]#Scenario
{
	background-image:url(gamesetup/tab_right_default.png);
}

.tabs  > .strip > [panel]#Scenario:current
{
	background-image:url(gamesetup/tab_right_highlighted.png);
}

.tabs > [name]
{
    display: none;
}

.tabs > [name]:expanded 
{ 
    background-image: none;
    padding: 0px;
    margin: 0px;
    display: block; 
    height: 100%%;
    width: 100%%;
    overflow: hidden;
}

.gotlisch
{
	font-family: Arial;
	font-size: 30px;
}

widget[type="select"]
{
	width: 100%%;
	height: 100%%;
	background-image:url(gamesetup/listbox.png);
	background-repeat: expand;
	background-position: 39px 0px 46px 0px;
	padding: 15px 17px 19px 15px;
	overflow-y: auto;
	overflow-x: hidden;
	flow: h-flow;
	vertical-scrollbar: my-v-scrollbar;
}

widget[type="select"] option
{
	font-size: 15px;
	width: 140px;
	background-image: none;
	background-color: transparent;
	color: #000000;
}

widget[type="select"] option.wide
{
	width: 210px;
}

widget[type="select"] option:active,
widget[type="select"] option:checked
{
	font-weight: bold;
	background-image: none;
	background-color: transparent;
	color: #000000;
}

@set my-v-scrollbar
{
  .prev 
  { 
    foreground-image:url(gamesetup/up_default.png); 
    foreground-position:50% 50%;
    foreground-repeat:no-repeat; 
  }
  
  .next 
  { 
    foreground-image:url(gamesetup/down_default.png); 
    foreground-position:50% 50%;
    foreground-repeat:no-repeat; 
  }
  
  .next-page, 
  .prev-page
  {
  	foreground-image:none; 
  }
  
  .slider 
  { 
    foreground-image:url(gamesetup/slider_default.png);
    foreground-position: 5px 0px 5px 0px;
    foreground-repeat:expand;
    margin:0px;
    padding:0px;
  }

  .slider:hover
  {
    foreground-image:url(gamesetup/slider_highlighted.png);
  }

  .slider:active
  { 
    foreground-image:url(gamesetup/slider_selected.png);
  }
  
  .next:disabled, .slider:disabled, 
  .prev:disabled  { height:0; border:none; foreground-image:none; }
  
  .base:disabled
  {
    background-image: none;
    background-repeat: no-repeat;
    width: 0;
  }
    
  .prev:hover
  { 
    foreground-image:url(gamesetup/up_highlighted.png); 
  }
  
  .next:hover
  { 
    foreground-image:url(gamesetup/down_highlighted.png); 
  }
  
  .prev:active
  { 
    foreground-image:url(gamesetup/up_selected.png); 
  }
  
  .next:active
  { 
    foreground-image:url(gamesetup/down_selected.png); 
  }
  
  .base { width: 18px; } /* explicit declaration of its width */
  
}
